<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' http://localhost:* ws://localhost:*;" />
    <title>DeskForge + BeatSync</title>
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <div id="app">
      <!-- Sidebar Navigation -->
      <aside class="sidebar">
        <div>
          <div class="sidebar-header">
            <div class="logo-icon">⚡</div>
            <div class="logo-text">
              <h1>DeskForge</h1>
              <p>BeatSync Studio</p>
            </div>
          </div>

          <nav class="nav-menu">
            <div class="nav-item active" id="nav-notes">
              <span>📝</span>
              <span>Bloc de Notas</span>
            </div>
            <div class="nav-item disabled" title="Próximamente">
              <span>⏱️</span>
              <span>Pomodoro</span>
            </div>
            <div class="nav-item disabled" title="Próximamente">
              <span>🎵</span>
              <span>Reproductor</span>
            </div>
          </nav>
        </div>

        <div class="sidebar-footer">
          <button id="btn-about" class="btn-sidebar-footer">
            <span>ℹ️</span>
            <span>Acerca de DeskForge</span>
          </button>
          <button id="btn-minimize-tray" class="btn-sidebar-footer">
            <span>📌</span>
            <span>Minimizar a Tray</span>
          </button>
        </div>
      </aside>

      <!-- Main Workspace -->
      <main class="main-content">
        <!-- Topbar -->
        <header class="topbar">
          <div class="window-title">
            <span>Workspace</span>
            <span>/</span>
            <span id="topbar-view-title" style="color: var(--text-primary);">Bloc de Notas</span>
          </div>

          <div class="topbar-actions">
            <div class="status-indicator">
              <div id="status-dot" class="status-dot"></div>
              <span id="status-text">Listo</span>
            </div>
          </div>
        </header>

        <!-- View Container -->
        <div class="view-container">
          <!-- Notepad Module -->
          <section class="notepad-wrapper">
            <div class="notepad-header">
              <div class="file-meta">
                <span id="note-file-path" class="file-name">Nota Sin Título</span>
                <span id="note-save-status" class="badge-status saved">Guardado localmente</span>
              </div>

              <div class="action-buttons">
                <button id="btn-note-new" class="btn-action">
                  <span>📄</span> Nueva
                </button>
                <button id="btn-note-open" class="btn-action">
                  <span>📂</span> Abrir
                </button>
                <button id="btn-note-save" class="btn-action primary">
                  <span>💾</span> Guardar
                </button>
                <button id="btn-note-save-as" class="btn-action">
                  <span>💾</span> Guardar Como...
                </button>
              </div>
            </div>

            <textarea
              id="note-editor"
              class="notepad-textarea"
              placeholder="Escribe tus notas de código o ideas aquí... Tu trabajo se autoguarda automáticamente."
            ></textarea>

            <div class="notepad-footer">
              <span id="note-status-msg">DeskForge + BeatSync v1.0.0</span>
              <div class="stats-group">
                <span id="note-word-count">0 palabras</span>
                <span id="note-char-count">0 caracteres</span>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
